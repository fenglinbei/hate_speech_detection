log_format hsd_paired_review escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"request":"$request","status":$status,"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"request_id":"$request_id","client_instance":"$http_x_review_client_instance"}';

server {
    listen 80;
    listen [::]:80;
    server_name hsd.fenglin.pro;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hsd-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://hsd.fenglin.pro$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hsd.fenglin.pro;

    ssl_certificate /etc/letsencrypt/live/hsd.fenglin.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hsd.fenglin.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:HSDReviewTLS:10m;
    ssl_session_tickets off;

    auth_basic "HSD attention visualization";
    auth_basic_user_file /etc/nginx/.htpasswd-hsd-case-attention;

    access_log /var/log/nginx/hsd.fenglin.pro.access.log hsd_paired_review;
    error_log /var/log/nginx/hsd.fenglin.pro.error.log warn;

    client_max_body_size 128k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Request-ID $request_id always;

    root /opt/hsd-case-attention/releases/incremental-20260919-01/public;
    index index.html;
    charset utf-8;
    gzip_static on;
    gzip_vary on;
    add_header Cache-Control "private, no-cache" always;

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
}
