<script>
'use strict';
const DATA=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg',number=x=>x==null?'NA':Number(x).toFixed(6),colors={focal:'#007c85',pre:'#ba6836',contrast:'#765a9f'};
function node(name,attrs={},text=''){const e=document.createElementNS(NS,name);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text)e.textContent=text;return e}
function chart(host,series,metric,title){
  host.replaceChildren();const svg=node('svg',{viewBox:'0 0 1120 390',role:'img','aria-label':title});
  svg.append(node('rect',{width:1120,height:390,fill:'white'}));svg.append(node('text',{x:68,y:22,fill:'#15364c','font-size':15},title));
  const vals=series.flatMap(s=>s.rows.map(r=>r[metric])).filter(v=>v!=null&&Number.isFinite(v));
  let lo=Math.min(0,...vals),hi=Math.max(0,...vals);if(lo===hi){lo-=1;hi+=1}const gap=(hi-lo)*.08;lo-=gap;hi+=gap;
  const X=l=>68+l/(DATA.layers-1)*1020,Y=v=>335-(v-lo)/(hi-lo)*285;
  for(let i=0;i<=5;i++){const v=lo+(hi-lo)*i/5,y=Y(v);svg.append(node('line',{x1:68,y1:y,x2:1088,y2:y,stroke:'#e4ebef'}));svg.append(node('text',{x:60,y:y+4,'text-anchor':'end',fill:'#527184','font-size':11},v.toFixed(3)))}
  svg.append(node('line',{x1:68,y1:Y(0),x2:1088,y2:Y(0),stroke:'#7a929f','stroke-dasharray':'4 3'}));
  for(const l of [...new Set([0,5,10,15,20,25,30,DATA.layers-1])].filter(l=>l<DATA.layers))svg.append(node('text',{x:X(l),y:358,'text-anchor':'middle',fill:'#527184','font-size':12},String(l)));
  svg.append(node('text',{x:570,y:380,'text-anchor':'middle',fill:'#527184','font-size':12},'替换的 decoder 块（从0开始）'));
  for(const s of series){let path='',open=false;for(const r of s.rows){const v=r[metric];if(v==null){open=false;continue}path+=(open?' L':' M')+X(r.layer)+' '+Y(v);open=true}svg.append(node('path',{d:path,stroke:colors[s.group],fill:'none','stroke-width':2}));for(const r of s.rows){const v=r[metric];if(v==null)continue;const dot=node('circle',{cx:X(r.layer),cy:Y(v),r:3.1,fill:colors[s.group],'data-layer':r.layer,'data-group':s.group,'data-value':v,'data-job':r.job_id||''});dot.append(node('title',{},'层 '+r.layer+' · '+s.label+' · '+number(v)));svg.append(dot)}}
  if(!vals.length)svg.append(node('text',{x:550,y:195,'text-anchor':'middle',fill:'#738894'},'NA · 无测量值或比例分母未分辨'));
  host.append(svg);
}
function draw(writeHash=true){
  const q=$('query').value,d=$('recipient').value,req=DATA.requests.find(r=>r.query_id===q&&r.dictionary_id===d),metric=$('metric').value;
  const all=DATA.effects.filter(e=>e.recipient===req.request_id),base=DATA.baselines.find(s=>s.request_id===req.request_id),donor=DATA.baselines.find(s=>s.query_id===q&&s.dictionary_id!==d);
  $('summary').textContent=base?'接收方 '+base.raw_prediction+'，m='+number(base.m)+'；供体 '+donor.raw_prediction+'，m='+number(donor.m)+'；参考 '+base.reference:'真实材料已固定；尚无GPU测量。';
  const geom=req.patch_position_sets;$('geometry').textContent=Object.entries(geom).map(([g,ps])=>(g==='focal'?'嘿嘿位置':'前置位置')+'：'+ps.map(p=>p+'「'+req.token_text[p]+'」').join('、')).join('；');$('prompt').textContent=req.prompt_text;
  chart($('plot'),['focal','pre'].map(g=>({group:g,label:g==='focal'?'嘿嘿位置':'前置位置',rows:all.filter(e=>e.group===g)})),metric,$('metric').selectedOptions[0].textContent);
  const pairs=DATA.position_differences.filter(e=>e.recipient===req.request_id);chart($('contrast'),[{group:'contrast',label:'焦点减前置',rows:pairs}],'delta_m','m(焦点替换) − m(前置替换)');
  $('bounds').textContent=DATA.margin_error_bound==null?'未测量的格子显示NA，不当作零。':'单端点工程界 ±'+DATA.margin_error_bound+'；Δm与焦点减前置的界 ±'+(2*DATA.margin_error_bound)+'。完整比例范围见JSON；不是置信区间。';
  const tbody=$('values').tBodies[0];tbody.replaceChildren();
  for(let layer=0;layer<DATA.layers;layer++)for(const g of ['focal','pre']){const e=all.find(x=>x.layer===layer&&x.group===g),tr=document.createElement('tr');tr.dataset.layer=layer;tr.dataset.group=g;
    const values=[layer,g==='focal'?'嘿嘿':'前置',e?number(e.m):'NA',e?number(e.delta_m):'NA',e?number(e.donor_gap_fraction):'NA',e?e.prediction:'NA',e?(e.flip===null?'NA':e.flip?'是':'否'):'NA',e?e.transition:'NA'];
    values.forEach((v,i)=>{const td=document.createElement('td');td.textContent=v;if(v==='NA')td.className='na';if(e&&i>=2&&i<=4)td.dataset.value=e[['m','delta_m','donor_gap_fraction'][i-2]]??'';tr.append(td)});tbody.append(tr)}
  if(writeHash)history.replaceState(null,'','#query='+q+'&recipient='+d+'&metric='+metric);
  window.HFP.current={request_id:req.request_id,metric,rows:all.length};
}
window.HFP={DATA,draw,current:null};$('status').textContent=DATA.status;
for(const note of DATA.notes){const li=document.createElement('li');li.textContent=note;$('notes').append(li)}
function loadHash(){const p=new URLSearchParams(location.hash.slice(1));for(const id of ['query','recipient','metric'])if([...$(id).options].some(o=>o.value===p.get(id)))$(id).value=p.get(id);draw(false)}
for(const id of ['query','recipient','metric'])$(id).addEventListener('change',()=>draw());addEventListener('hashchange',loadHash);
$('export').addEventListener('click',()=>{const blob=new Blob([new XMLSerializer().serializeToString($('plot').firstChild)],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=HFP.current.request_id+'-'+HFP.current.metric+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
loadHash();
</script></html>
